services:
  app:
    image: agencyos-app:latest
    # build:
    #   context: .
    #   target: runner
    #   args:
    #     - CONTAINER_PORT=${CONTAINER_PORT:-3000}
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /app/docker/scripts/init-or-migrate.sh ]; then
          echo "ERROR: init-or-migrate.sh not found."
          exit 1
        fi
        INIT_COMMAND='yarn mercato init' sh /app/docker/scripts/init-or-migrate.sh
        yarn start
    volumes:
      - init_marker:/tmp/init-marker
      - attachments_storage:/app/apps/mercato/storage
      - mcp_shared:/run/mcp-shared:ro
    working_dir: /app/apps/mercato
    ports:
      - "3000:3000"
    expose:
      - "3000"
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.http-0-dmgagycqiijfxq6w9lch32t1.entryPoints=http"
      - "traefik.http.routers.http-0-dmgagycqiijfxq6w9lch32t1.middlewares=redirect-to-https"
      - "traefik.http.routers.http-0-dmgagycqiijfxq6w9lch32t1.rule=Host(`dmgagycqiijfxq6w9lch32t1.ty-dev.site`) && PathPrefix(`/`)"
      - "traefik.http.routers.http-0-dmgagycqiijfxq6w9lch32t1.service=http-0-dmgagycqiijfxq6w9lch32t1"
      - "traefik.http.routers.https-0-dmgagycqiijfxq6w9lch32t1.entryPoints=https"
      - "traefik.http.routers.https-0-dmgagycqiijfxq6w9lch32t1.middlewares=gzip"
      - "traefik.http.routers.https-0-dmgagycqiijfxq6w9lch32t1.rule=Host(`dmgagycqiijfxq6w9lch32t1.ty-dev.site`) && PathPrefix(`/`)"
      - "traefik.http.routers.https-0-dmgagycqiijfxq6w9lch32t1.service=https-0-dmgagycqiijfxq6w9lch32t1"
      - "traefik.http.routers.https-0-dmgagycqiijfxq6w9lch32t1.tls.certresolver=letsencrypt"
      - "traefik.http.routers.https-0-dmgagycqiijfxq6w9lch32t1.tls=true"
      - "traefik.http.services.http-0-dmgagycqiijfxq6w9lch32t1.loadbalancer.server.port=3000"
      - "traefik.http.services.https-0-dmgagycqiijfxq6w9lch32t1.loadbalancer.server.port=3000"
      - "traefik.docker.network=coolify"
      - "caddy_ingress_network=coolify"
    environment:
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=3072}
      PORT: ${CONTAINER_PORT:-3000}
      HOSTNAME: 0.0.0.0
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open-mercato}}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CACHE_REDIS_URL: redis://redis:6379
      CACHE_STRATEGY: redis
      RATE_LIMIT_STRATEGY: ${RATE_LIMIT_STRATEGY:-memory}
      ENABLE_CRUD_API_CACHE: ${ENABLE_CRUD_API_CACHE:-true}
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-gpt-5-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-contact.tydev@gmail.com}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-contact.tydev@gmail.com}
      OM_INIT_SUPERADMIN_PASSWORD: ${OM_INIT_SUPERADMIN_PASSWORD:-password}
      MCP_URL: http://mcp:3001
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  mcp:
    image: agencyos-app:latest
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /app/docker/scripts/mcp-entrypoint.sh ]; then
          echo "ERROR: mcp-entrypoint.sh not found."
          exit 1
        fi
        sh /app/docker/scripts/mcp-entrypoint.sh
    volumes:
      - mcp_shared:/run/mcp-shared
    ports:
      - "3001:3001"
    expose:
      - "3001"
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.mcp-https.entryPoints=https"
      - "traefik.http.routers.mcp-https.rule=Host(`dmgagycqiijfxq6w9lch32t1.ty-dev.site`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp-https.priority=100"
      - "traefik.http.routers.mcp-https.tls=true"
      - "traefik.http.routers.mcp-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mcp-https.service=mcp-service"
      - "traefik.http.services.mcp-service.loadbalancer.server.port=3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: ${MCP_NODE_OPTIONS:---max-old-space-size=2048}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open-mercato}}
      CACHE_REDIS_URL: redis://redis:6379
      CACHE_STRATEGY: redis
      AUTO_SPAWN_WORKERS: "false"
      AUTO_SPAWN_SCHEDULER: "false"
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: http://app:3000
      APP_WAIT_URL: http://app:3000
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-contact.tydev@gmail.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MCP_PORT: "3001"
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
      MCP_WAIT_FOR_APP_TIMEOUT: 1800
      MCP_DEBUG: ${MCP_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 900s

  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory ${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  init_marker:
  attachments_storage:
  mcp_shared:

networks:
  coolify:
    external: true
  default:
